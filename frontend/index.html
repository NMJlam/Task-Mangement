<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fcfbf9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#12120f" media="(prefers-color-scheme: dark)" />
    <title>Club Task Platform</title>
    <link
      rel="preload"
      href="/fonts/DepartureMono-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <script>
      /*
       * Paints the stored theme before the first frame. `main.tsx` also applies
       * it, but that runs after the browser has painted this empty document, so
       * a dark-mode reader would get a flash of the light page. Mirrors
       * `applyTheme` in `lib/theme.ts`: every palette but light takes the
       * `dark` class, and the three named palettes also set `data-theme`.
       * Same storage key and same light default, wrapped because storage can
       * be off-limits. `index-html.test.ts` holds the two in step.
       */
      (function () {
        try {
          var theme = localStorage.getItem("theme");
          var root = document.documentElement;
          if (["dark", "amber", "green", "gruvbox"].indexOf(theme) !== -1) {
            root.classList.add("dark");
          }
          if (["amber", "green", "gruvbox"].indexOf(theme) !== -1) {
            root.setAttribute("data-theme", theme);
          }
        } catch (error) {
          /* Nothing to remember it in; the app still draws, in light. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
